<style>
  .section-tab-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--heading-color); border-left: 5px solid var(--accent-color); padding-left: 14px; margin-bottom: 28px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-color); font-weight: 600; text-decoration: none; font-size: 14px; margin-bottom: 16px; }

  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 24px; }
  .player-card { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 2/3; cursor: pointer; transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), box-shadow 0.35s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.25); background: #111; animation: cardIn 0.5s ease both; }
  .player-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
  .player-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.04) 30%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 70%, transparent 100%); opacity: 0; transition: opacity 0.3s; z-index: 3; pointer-events: none; }
  .player-card:hover::before { opacity: 1; }
  .player-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--accent-color), #f9a825); z-index: 4; }

  .player-card .card-name { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; color: #fff; line-height: 1; margin-bottom: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .player-card .card-meta { font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,0.55); text-transform: uppercase; }
  .player-card .card-school { position: absolute; top: 14px; right: -28px; background: linear-gradient(90deg, var(--accent-color), #f9a825); color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 1px; padding: 3px 36px; transform: rotate(45deg); z-index: 4; text-transform: uppercase; }
  .captain-badge { position: absolute; top: 12px; left: 12px; z-index: 5; width: 28px; height: 28px; background: linear-gradient(135deg, #f9a825, #f57f17); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(249,168,37,0.6); font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #fff; line-height: 1; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .standings-table th { background: var(--accent-color); color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; text-align: center; white-space: nowrap; padding: 10px 12px; }
  .standings-table td { text-align: center; vertical-align: middle; padding: 10px 12px; font-size: 13px; }
  .standings-table td:first-child { text-align: left; font-weight: 700; }
  .standings-table tbody tr:hover { background: color-mix(in srgb, var(--accent-color), transparent 92%); }
  .standings-table .my-school { background: color-mix(in srgb, var(--accent-color), transparent 85%); font-weight: 700; }
  .standings-table .my-school td:first-child::after { content: ' ★'; color: var(--accent-color); }
  .tier-badge { display: inline-block; background: var(--accent-color); color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; padding: 4px 16px; border-radius: 4px; margin-bottom: 14px; }
  html.dark-mode .standings-table .my-school { background: color-mix(in srgb, var(--accent-color), transparent 78%); }
  .schedule-table th { background: color-mix(in srgb, var(--accent-color), transparent 15%); color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; padding: 10px 14px; }
  .schedule-table td { vertical-align: middle; padding: 10px 14px; font-size: 13px; }
  .manual-table th { background: var(--accent-color); color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; padding: 10px 14px; }
  .manual-table td { vertical-align: middle; padding: 10px 14px; font-size: 13px; }
  .manual-table tbody tr:hover { background: color-mix(in srgb, var(--accent-color), transparent 92%); }
  .badge-win      { background:#198754; color:#fff; padding:3px 12px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-loss     { background:#dc3545; color:#fff; padding:3px 12px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-upcoming { background:#6c757d; color:#fff; padding:3px 12px; border-radius:20px; font-size:11px; font-weight:700; }
  .replay-btn { display:inline-flex; align-items:center; gap:4px; color:var(--accent-color); font-weight:600; font-size:12px; text-decoration:none; }
  .replay-btn:hover { text-decoration:underline; }
  .data-loading { color: var(--default-color); opacity: 0.6; font-style: italic; }
  .updated-tag  { font-size: 11px; color: var(--default-color); opacity: 0.45; margin-top: 8px; }

<script>
// ── Roster ────────────────────────────────────────────────────────────────
// Ajoutez vos joueurs ici.
// Exemple: { name: "Prénom Nom", img: "photo.png", position: "Passeur", captain: false }
// captain: true pour le/la capitaine
const PLAYERS = [
];

const IMG_BASE = "/assets/img/sportsplayers/BKFS/";
const roster = document.getElementById("roster-container");

if (PLAYERS.length === 0) {
  roster.innerHTML = '<p class="data-loading"><i class="bi bi-people me-1"></i>L\'équipe sera annoncée prochainement.</p>';
} else {
  PLAYERS.forEach(function(p, i) {
    var card = document.createElement("div");
    card.className = "player-card" + (p.captain ? " captain" : "");
    card.style.animationDelay = (i * 60) + "ms";
    card.innerHTML =
      '<img class="card-photo" src="' + IMG_BASE + p.img + '" alt="' + p.name + '" loading="lazy"/>' +
      '<div class="card-overlay"></div>' +
      '<div class="card-school">GAGE</div>' +
      (p.captain ? '<div class="captain-badge" title="Capitaine">C</div>' : '') +
      '<div class="card-info">' +
        '<div class="card-position">' + p.position + '</div>' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-meta">Filles Senior</div>' +
      '</div>';
    roster.appendChild(card);
  });
}

// ── HSSAA Data ────────────────────────────────────────────────────────────
var DATA_FILE = "/assets/data/sports/basketball-filles-senior.json";
var MY_SCHOOL = ["gaétan","gervais","gage","g.g"];
function isMySchool(t) { return MY_SCHOOL.some(function(k) { return t.toLowerCase().indexOf(k) >= 0; }); }
var LOGO_HTML = '<img src="/assets/img/gage-logo-small.png" alt="GAGE" style="height:20px;width:auto;margin-right:6px;vertical-align:middle;">';
function nameCell(n) { return isMySchool(n) ? LOGO_HTML + n : n; }
function boldStyle(n) { return isMySchool(n) ? "font-weight:700;" : ""; }

function renderStandings(standings, updated) {
  var el = document.getElementById("standings-container");
  if (!standings || !standings.length) {
    el.innerHTML = '<p class="data-loading">Aucun classement disponible pour l\'instant.</p>'; return;
  }

  // Find the first standings object that has actual team rows (not the legend)
  var raw = null;
  for (var i = 0; i < standings.length; i++) {
    if (standings[i].rows && standings[i].rows.length > 1) { raw = standings[i]; break; }
  }
  if (!raw) { el.innerHTML = '<p class="data-loading">Aucun classement disponible pour l\'instant.</p>'; return; }

  // Detect column headers from the first header row in the data
  var headerRow = null;
  var dataRows = [];
  raw.rows.forEach(function(cells) {
    var isHeader = cells.indexOf("School") >= 0 || cells.indexOf("MP") >= 0 || cells.indexOf("GP") >= 0;
    if (isHeader && !headerRow) { headerRow = cells; }
    else if (cells.length >= 3 && cells[1] && cells[1] !== "" && cells[1] !== "School") { dataRows.push(cells); }
  });

  // Build display headers from detected header row
  var displayHeaders = ["École"];
  if (headerRow) {
    // Skip first empty cell and "School" cell, map the rest
    var colMap = { "GP":"PJ","MP":"PJ","W":"V","L":"D","T":"N","PTS":"PTS",
                   "WIN %":"V%","PF":"PF","PA":"PA","SW":"SW","SL":"SL",
                   "PW":"PG","PL":"PL","STREAK":"Série" };
    headerRow.forEach(function(h, idx) {
      if (idx < 2) return; // skip blank + School
      displayHeaders.push(colMap[h] || h);
    });
  }

  // Split into tiers
  var tiers = [], current = null;
  var tierName = (raw.headers && raw.headers[0]) ? raw.headers[0] : "Classement";
  raw.rows.forEach(function(cells) {
    var isHeader = cells.indexOf("School") >= 0 || (cells.indexOf("MP") >= 0 && cells.indexOf("W") >= 0) || (cells.indexOf("GP") >= 0 && cells.indexOf("W") >= 0);
    if (isHeader) { if (current && current.rows.length) tiers.push(current); current = { tier: null, rows: [] }; }
    else if (cells.length >= 3 && cells[1] && cells[1] !== "") { if (current) current.rows.push(cells); }
  });
  if (current && current.rows.length) tiers.push(current);
  if (!tiers.length) tiers.push({ tier: tierName, rows: dataRows });

  tiers.forEach(function(t) {
    var match = t.rows[0] && t.rows[0][1] && t.rows[0][1].match(/\(([A-Z]+)\)/);
    t.tier = match ? match[1] + " — " + tierName : tierName;
  });

  var html = "";
  tiers.forEach(function(t) {
    var rows = t.rows.map(function(cells) {
      var school = cells[1] || "", stats = cells.slice(2), mine = isMySchool(school);
      var displayName = school.replace(/\s*\([A-Z]+\)$/, "");
      var nc = mine ? LOGO_HTML + displayName : displayName;
      return '<tr class="' + (mine ? "my-school" : "") + '"><td>' + nc + '</td>' +
        stats.map(function(c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
    }).join("");
    var headerCells = displayHeaders.map(function(h) { return '<th>' + h + '</th>'; }).join("");
    html += '<span class="tier-badge">' + t.tier + '</span>' +
      '<div class="table-responsive mb-4"><table class="table table-bordered standings-table">' +
      '<thead><tr>' + headerCells + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  });

  if (updated) html += '<p class="updated-tag">Source : HSSAA — Mise à jour : ' + updated + '</p>';
  el.innerHTML = html;
}

function renderScores(scores, replays) {
  var upcoming = [], played = [], gameIndex = 0;
  replays = replays || [];
  var currentDate = "";

  for (var i = 0; i < scores.length; i++) {
    var row = scores[i];
    if (row[0] === "__DATE__") { currentDate = row[1] || ""; continue; }
    if (!row[0] || row[0] === "Visitor") continue;
    if (row[0].indexOf("Location:") === 0 || row[0].indexOf("Notes:") === 0) continue;
    if (row.length <= 2) continue;

    var location = "", notes = "";
    var j = i + 1;
    while (j < scores.length && scores[j] && (scores[j][0] || "").match(/^(Location:|Notes:)/)) {
      if ((scores[j][0] || "").indexOf("Location:") === 0) location = (scores[j][1] || scores[j][0].replace("Location: ","")).trim();
      if ((scores[j][0] || "").indexOf("Notes:") === 0) notes = (scores[j][1] || scores[j][0].replace("Notes: ","")).trim();
      j++;
    }
    if (j > i + 1) i = j - 1;

    gameIndex++;
    var replayEntry = replays.find(function(r) { return r.index === gameIndex; });
    var replay = replayEntry ? (replayEntry.replay || "") : "";
    var gameDate = currentDate;

    if (row.length === 3) {
      upcoming.push({ date: gameDate, visitor: row[0], time: row[1], home: row[2], location: location, notes: notes, replay: replay });
    } else if (row.length >= 4) {
      var visitor = row[0], vScore = row[1], hScore = row[2], home = row[3];
      var vNum = parseInt(vScore), hNum = parseInt(hScore);
      var result = "", badgeClass = "";
      if (!isNaN(vNum) && !isNaN(hNum)) {
        if (isMySchool(visitor)) { result = vNum > hNum ? "Victoire" : "Défaite"; badgeClass = vNum > hNum ? "badge-win" : "badge-loss"; }
        else if (isMySchool(home)) { result = hNum > vNum ? "Victoire" : "Défaite"; badgeClass = hNum > vNum ? "badge-win" : "badge-loss"; }
        else { result = vNum + " – " + hNum; badgeClass = "badge-upcoming"; }
      }
      played.push({ date: gameDate, visitor: visitor, vScore: vScore, hScore: hScore, home: home, result: result, badgeClass: badgeClass, location: location, notes: notes, replay: replay });
    }
  }

  var upEl = document.getElementById("upcoming-container");
  if (upEl) {
    if (!upcoming.length) {
      upEl.innerHTML = '<p class="data-loading">Aucun match à venir.</p>';
    } else {
      var hasDate = upcoming.some(function(g) { return g.date; });
      upEl.innerHTML =
        '<div class="table-responsive"><table class="table table-bordered schedule-table">' +
        '<thead><tr>' + (hasDate ? '<th>Date</th>' : '') + '<th>Visiteur</th><th>Heure</th><th>Domicile</th><th>Lieu</th></tr></thead><tbody>' +
        upcoming.map(function(g) {
          return '<tr>' + (hasDate ? '<td style="white-space:nowrap;font-size:12px;">' + (g.date || "—") + '</td>' : '') +
            '<td style="' + boldStyle(g.visitor) + '">' + nameCell(g.visitor) + '</td>' +
            '<td class="text-center">' + g.time + '</td>' +
            '<td style="' + boldStyle(g.home) + '">' + nameCell(g.home) + '</td>' +
            '<td class="text-muted" style="font-size:12px;">' + (g.location || "—") + '</td>' +
            '</tr>';
        }).join("") + '</tbody></table></div>';
    }
  }

  var plEl = document.getElementById("scores-container");
  if (plEl) {
    if (!played.length) {
      plEl.innerHTML = '<p class="data-loading">Aucun résultat pour l\'instant.</p>';
    } else {
      var hasDate = played.some(function(g) { return g.date; });
      plEl.innerHTML =
        '<div class="table-responsive"><table class="table table-bordered schedule-table">' +
        '<thead><tr>' + (hasDate ? '<th>Date</th>' : '') + '<th>Visiteur</th><th>Score</th><th>Score</th><th>Domicile</th><th>Résultat</th><th>Lieu</th><th>Vidéo</th></tr></thead><tbody>' +
        played.map(function(g) {
          return '<tr>' + (hasDate ? '<td style="white-space:nowrap;font-size:12px;">' + (g.date || "—") + '</td>' : '') +
            '<td style="' + boldStyle(g.visitor) + '">' + nameCell(g.visitor) + '</td>' +
            '<td class="text-center">' + g.vScore + '</td>' +
            '<td class="text-center">' + g.hScore + '</td>' +
            '<td style="' + boldStyle(g.home) + '">' + nameCell(g.home) + '</td>' +
            '<td class="text-center"><span class="' + g.badgeClass + '">' + g.result + '</span></td>' +
            '<td class="text-muted" style="font-size:12px;">' + (g.location || "—") + '</td>' +
            '<td class="text-center">' + (g.replay ? '<a href="' + g.replay + '" target="_blank" class="replay-btn"><i class="bi bi-play-circle-fill"></i> Vidéo</a>' : '') + '</td>' +
            '</tr>';
        }).join("") + '</tbody></table></div>';
    }
  }
}

fetch(DATA_FILE)
  .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(d) { renderScores(d.scores || [], []); renderStandings(d.standings || [], d.updated); })
  .catch(function(err) {
    console.error("Erreur:", err);
    ["upcoming-container","scores-container","standings-container"].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = '<p class="data-loading">Données indisponibles. Réessayez plus tard.</p>';
    });
  });

</script>
