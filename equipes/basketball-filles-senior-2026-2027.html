<script>
// ── Roster ────────────────────────────────────────────────────────────────

const PLAYERS = [
  { name: "Chloe",   img: "Chloe-Guard.webp",         position: "Guard",         captain: false },
  { name: "Eliana",  img: "Eliana-Guard.webp",        position: "Guard",         captain: false },
  { name: "Emmylou", img: "Emmylou-Guard.webp",       position: "Guard",         captain: false },
  { name: "Evelyn",  img: "Evelyn-Guard.webp",        position: "Guard",         captain: false },
  { name: "Hanya",   img: "Hanya-Guard.webp",         position: "Guard",         captain: false },
  { name: "Israe",   img: "Israe-Guard.webp",         position: "Guard",         captain: false },
  { name: "Kenzie",  img: "Kenzie-Guard.webp",        position: "Guard",         captain: false },
  { name: "Liliana", img: "Liliana-Guard.webp",       position: "Guard",         captain: false },
  { name: "Milena",  img: "Milena-PowerForward.webp", position: "Power Forward", captain: false },
  { name: "Naiara",  img: "Naiara-PointGuard.webp",   position: "Point Guard",   captain: false },
  { name: "Sara",    img: "Sara-Guard.webp",          position: "Guard",         captain: false },
  { name: "Sasha",   img: "Sasha-Forward.webp",       position: "Forward",       captain: false },
];

const IMG_BASE = "/assets/img/sportsplayers/2026-2027/BKFS/";
const roster = document.getElementById("roster-container");

if (PLAYERS.length === 0) {
  roster.innerHTML = '<p class="data-loading"><i class="bi bi-people me-1"></i>L\'équipe sera annoncée prochainement.</p>';
} else {
  PLAYERS.forEach(function(p, i) {
    var card = document.createElement("div");
    card.className = "player-card" + (p.captain ? " captain" : "");
    card.style.animationDelay = (i * 60) + "ms";
    card.innerHTML =
      '<img class="card-photo" src="' + IMG_BASE + p.img + '" alt="' + p.name + '" loading="lazy"/>' +
      '<div class="card-overlay"></div>' +
      '<div class="card-school">GAGE</div>' +
      (p.captain ? '<div class="captain-badge" title="Capitaine">C</div>' : '') +
      '<div class="card-info">' +
        '<div class="card-position">' + p.position + '</div>' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-meta">Filles Senior</div>' +
      '</div>';
    roster.appendChild(card);
  });
}

// ── Enregistrements de matchs ────────────────────────────────────────────
// Ajoutez un lien par match filmé. "adversaire" = un mot du nom de l'autre
// équipe (pas besoin du nom complet). Ajoutez "date" seulement si vous avez
// joué deux fois contre la même équipe.
//
//   { adversaire: "Acton",  url: "https://youtu.be/XXXXXXXX" },
//   { adversaire: "Sainte-Trinite", date: "October 14", url: "https://youtu.be/YYYYYYYY" },
//
var REPLAYS = [

];

// ── HSSAA Data — Basketball ───────────────────────────────────────────────
var DATA_FILE = "/assets/data/sports/basketball-filles-senior.json";
var MY_SCHOOL = ["gaétan","gervais","gage","g.g"];
function isMySchool(t) { return MY_SCHOOL.some(function(k) { return t.toLowerCase().indexOf(k) >= 0; }); }
var LOGO_HTML = '<img src="/assets/img/gage-logo-small.png" alt="GAGE" style="height:20px;width:auto;margin-right:6px;vertical-align:middle;">';
function nameCell(n) { return isMySchool(n) ? LOGO_HTML + n : n; }
function boldStyle(n) { return isMySchool(n) ? "font-weight:700;" : ""; }

// ── Standings — Basketball specific ──────────────────────────────────────
// Basketball standings columns: GP, W, L, T, PTS, WIN%, PF, PA, STREAK
// Schools are grouped by bracket suffix (AA), (AAA) etc. within one tier
function renderStandings(standings, updated) {
  var el = document.getElementById("standings-container");
  if (!standings || !standings.length) {
    el.innerHTML = '<p class="data-loading">Aucun classement disponible.</p>'; return;
  }

  var colMap = { "GP":"PJ","MP":"PJ","W":"V","L":"D","T":"N","PTS":"PTS",
                 "WIN %":"% V","PF":"PM","PA":"PA","SW":"MG","SL":"MP",
                 "PW":"PG","PL":"PP","STREAK":"Série" };
  var colTitles = { "PJ":"Parties jouées","V":"Victoires","D":"Défaites","N":"Matchs nuls",
                    "PTS":"Points au classement","% V":"Pourcentage de victoires",
                    "PM":"Points marqués","PA":"Points accordés","MG":"Manches gagnées",
                    "MP":"Manches perdues","PG":"Points gagnés","PP":"Points perdus" };

  var html = "";

  standings.forEach(function(s) {
    if (!s.rows || s.rows.length < 2) return;
    var tierName = (s.headers && s.headers[0]) ? s.headers[0] : "";
    if (!tierName || tierName.indexOf("=") >= 0) return;

    var headerRow = null;
    var dataRows = [];
    s.rows.forEach(function(cells) {
      var isHeader = cells[1] === "School" || cells.indexOf("MP") >= 0 || cells.indexOf("GP") >= 0;
      if (isHeader && !headerRow) { headerRow = cells; }
      else if (cells.length >= 3 && cells[1] && cells[1] !== "" && cells[1] !== "School") {
        dataRows.push(cells);
      }
    });
    if (!dataRows.length) return;

    var displayHeaders = ["École"];
    if (headerRow) {
      headerRow.forEach(function(h, idx) {
        if (idx < 2) return;
        displayHeaders.push(colMap[h] || h);
      });
    }
    var headerCells = displayHeaders.map(function(h) {
      return '<th' + (colTitles[h] ? ' title="' + colTitles[h] + '"' : '') + '>' + h + '</th>';
    }).join("");

    var rows = dataRows.map(function(cells) {
      var school = cells[1] || "", stats = cells.slice(2), mine = isMySchool(school);
      var nc = mine ? LOGO_HTML + school : school;
      return '<tr class="' + (mine ? "my-school" : "") + '"><td>' + nc + '</td>' +
        stats.map(function(c) { return '<td>' + c + '</td>'; }).join("") + '</tr>';
    }).join("");

    html += '<span class="tier-badge">' + tierName + '</span>' +
      '<div class="table-responsive mb-4"><table class="table table-bordered standings-table">' +
      '<thead><tr>' + headerCells + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  });

  if (!html) html = '<p class="data-loading">Aucun classement disponible.</p>';
  if (updated) html += '<p class="updated-tag">Source : HSSAA — Mise à jour : ' + updated + '</p>';
  el.innerHTML = html;
}



function renderScores(scores, replays) {
  var upcoming = [], played = [];
  replays = replays || [];
  var currentDate = "";

  for (var i = 0; i < scores.length; i++) {
    var row = scores[i];
    if (row[0] === "__DATE__") { currentDate = row[1] || ""; continue; }
    if (!row[0] || row[0] === "Visitor") continue;
    if (row[0].indexOf("Location:") === 0 || row[0].indexOf("Notes:") === 0) continue;
    if (row.length <= 2) continue;
    var j = i + 1;
    while (j < scores.length && scores[j] && (scores[j][0] || "").match(/^(Location:|Notes:)/)) { j++; }
    if (j > i + 1) i = j - 1;
    var gameDate = currentDate;
    var replay = "";
    var timeIdx = -1;
    for (var k = 1; k < row.length; k++) {
      if (/^\d{1,2}:\d{2}\s*(AM|PM)?$/i.test((row[k] || "").trim())) { timeIdx = k; break; }
    }
    var lastCell = "";
    for (var z = row.length - 1; z > 0; z--) {
      if ((row[z] || "").trim() !== "") { lastCell = row[z].trim(); break; }
    }
    if (timeIdx > 0) {
      upcoming.push({ date: gameDate, visitor: row[0], time: row[timeIdx], home: lastCell });
    } else if (row.length >= 4) {
      var visitor = row[0], vScore = row[1], hScore = row[2], home = row[3];
      var vPts = parseInt(vScore), hPts = parseInt(hScore);
      var result = "", badgeClass = "";
      if (!isNaN(vPts) && !isNaN(hPts)) {
        if (isMySchool(visitor)) { result = vPts > hPts ? "Victoire" : "D\u00e9faite"; badgeClass = vPts > hPts ? "badge-win" : "badge-loss"; }
        else if (isMySchool(home)) { result = hPts > vPts ? "Victoire" : "D\u00e9faite"; badgeClass = hPts > vPts ? "badge-win" : "badge-loss"; }
        else { result = vPts + " \u2013 " + hPts; badgeClass = "badge-upcoming"; }
      }
      // Trouver l'enregistrement correspondant à cet adversaire
      var opponent = isMySchool(visitor) ? home : visitor;
      var rep = REPLAYS.find(function (x) {
        if (!x || !x.adversaire || !x.url) return false;
        var nameOk = opponent.toLowerCase().indexOf(x.adversaire.toLowerCase()) >= 0;
        if (!nameOk) return false;
        if (x.date) return (gameDate || "").toLowerCase().indexOf(x.date.toLowerCase()) >= 0;
        return true;
      });
      replay = rep ? rep.url : "";

      played.push({ date: gameDate, visitor: visitor, vScore: vScore, hScore: hScore,
        home: home, result: result, badgeClass: badgeClass, replay: replay });
    }
  }

  function groupByDate(games) {
    var groups = [], seen = {};
    games.forEach(function(g) {
      var d = g.date || "";
      if (!seen[d]) { seen[d] = []; groups.push({ date: d, games: seen[d] }); }
      seen[d].push(g);
    });
    return groups;
  }

  var DATE_ROW_STYLE = 'class="date-row"';

  var upEl = document.getElementById("upcoming-container");
  if (upEl) {
    if (!upcoming.length) {
      upEl.innerHTML = '<p class="data-loading">Aucun match \u00e0 venir.</p>';
    } else {
      var groups = groupByDate(upcoming);
      var html = '<div class="table-responsive"><table class="table table-bordered schedule-table"><thead><tr><th>Visiteur</th><th>Heure</th><th>Domicile</th></tr></thead><tbody>';
      groups.forEach(function(group) {
        if (group.date) html += '<tr><td colspan="3" ' + DATE_ROW_STYLE + '>' + group.date + '</td></tr>';
        group.games.forEach(function(g) {
          html += '<tr><td style="' + boldStyle(g.visitor) + '">' + nameCell(g.visitor) + '</td><td class="text-center">' + g.time + '</td><td style="' + boldStyle(g.home) + '">' + nameCell(g.home) + '</td></tr>';
        });
      });
      upEl.innerHTML = html + '</tbody></table></div>';
    }
  }

  var plEl = document.getElementById("scores-container");
  if (plEl) {
    if (!played.length) {
      plEl.innerHTML = '<p class="data-loading">Aucun r\u00e9sultat pour l\'instant.</p>';
    } else {
      var groups = groupByDate(played);
      var html = '<div class="table-responsive"><table class="table table-bordered schedule-table"><thead><tr><th>Visiteur</th><th>Score</th><th>Score</th><th>Domicile</th><th>R\u00e9sultat</th><th>Vid\u00e9o</th></tr></thead><tbody>';
      groups.forEach(function(group) {
        if (group.date) html += '<tr><td colspan="6" ' + DATE_ROW_STYLE + '>' + group.date + '</td></tr>';
        group.games.forEach(function(g) {
          html += '<tr>' +
            '<td style="' + boldStyle(g.visitor) + '">' + nameCell(g.visitor) + '</td>' +
            '<td class="text-center" style="font-weight:700;">' + g.vScore + '</td>' +
            '<td class="text-center" style="font-weight:700;">' + g.hScore + '</td>' +
            '<td style="' + boldStyle(g.home) + '">' + nameCell(g.home) + '</td>' +
            '<td class="text-center"><span class="' + g.badgeClass + '">' + g.result + '</span></td>' +
            '<td class="text-center">' + (g.replay ? '<a href="' + g.replay + '" target="_blank" class="replay-btn"><i class="bi bi-play-circle-fill"></i> Vid\u00e9o</a>' : '') + '</td>' +
            '</tr>';
        });
      });
      plEl.innerHTML = html + '</tbody></table></div>';
    }
  }
}



fetch(DATA_FILE)
  .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(d) { renderScores(d.scores || [], []); renderStandings(d.standings || [], d.updated); })
  .catch(function(err) {
    console.error("Erreur:", err);
    ["upcoming-container","scores-container","standings-container"].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = '<p class="data-loading">Donn\u00e9es indisponibles.</p>';
    });
  });

</script>
