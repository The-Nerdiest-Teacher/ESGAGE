<script>
// ── Compétitions ─────────────────────────────────────────────────────────
// Une ligne { ... } par compétition, la plus récente en haut ou en bas, comme vous voulez.
//   date : "AAAA-MM-JJ"   lieu / lieuEn : le lieu en français / en anglais
//   resultats : une ligne par nage. Nom = prénom + initiale(s) du nom (« Emma M. »).
//     { nom: "Emma M.", epreuve: "50 m libre", categorie: "Filles junior", temps: "31.45", place: 3 }
//     categorie et place sont facultatifs. Les places 1, 2 et 3 reçoivent une médaille.
//     Épreuves traduites en anglais toutes seules : libre, dos, brasse, papillon, 4 nages, relais.
var COMPETITIONS = [
  {
    nom: "1re compétition", nomEn: "First meet",
    date: "2026-11-19",
    lieu: "Université McMaster, Hamilton", lieuEn: "McMaster University, Hamilton",
    resultats: [
    ]
  },
  {
    nom: "2e compétition", nomEn: "Second meet",
    date: "2026-12-10",
    lieu: "Université McMaster, Hamilton", lieuEn: "McMaster University, Hamilton",
    resultats: [
    ]
  }
];

var STROKES = [[/4 nages/i, "IM"], [/quatre nages/i, "IM"], [/nage libre|libre/i, "freestyle"], [/dos/i, "backstroke"],
  [/brasse/i, "breaststroke"], [/papillon/i, "butterfly"], [/relais/i, "relay"]];
var CATS = [[/filles/i, "Girls"], [/garçons|garcons/i, "Boys"], [/mixte/i, "Mixed"], [/minime/i, "Midget"]];
function trEvent(text, list) {
  if (!GAGE_EN || !text) return text || "";
  list.forEach(function(pair) { text = text.replace(pair[0], pair[1]); });
  // « Garçons senior » → « Senior Boys » ; « relais 4 x 50 m libre » → « 4 x 50 m freestyle relay »
  if (list === CATS) text = text.replace(/^(Girls|Boys|Mixed) (.+)$/, function(m, g, lvl) { return lvl.charAt(0).toUpperCase() + lvl.slice(1) + " " + g; });
  if (/^relay /.test(text)) text = text.replace(/^relay (.+)$/, "$1 relay");
  return text;
}
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

var MEDALS = { 1: ["gold", tr("Médaille d'or", "Gold medal")], 2: ["silver", tr("Médaille d'argent", "Silver medal")], 3: ["bronze", tr("Médaille de bronze", "Bronze medal")] };
var meetsBox = document.getElementById("meets-container");
var today = new Date(); today.setHours(0, 0, 0, 0);

COMPETITIONS.forEach(function(c) {
  var d = new Date(c.date + "T12:00:00");
  var dateText = d.toLocaleDateString(tr("fr-CA", "en-CA"), { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  dateText = dateText.charAt(0).toUpperCase() + dateText.slice(1);
  var hasResults = c.resultats && c.resultats.length > 0;
  var past = d < today;
  var status = hasResults || past
    ? '<span class="nat-status done">' + tr("Terminée", "Completed") + '</span>'
    : '<span class="nat-status upcoming">' + tr("À venir", "Upcoming") + '</span>';

  var html = '<div class="nat-card-head"><h3>' + esc(tr(c.nom, c.nomEn || c.nom)) + '</h3>' + status + '</div>' +
    '<div class="nat-meta"><span><i class="bi bi-calendar-event"></i>' + esc(dateText) + '</span>' +
    '<span><i class="bi bi-geo-alt-fill"></i>' + esc(tr(c.lieu, c.lieuEn || c.lieu)) + '</span></div>';

  if (hasResults) {
    html += '<div class="table-responsive"><table><thead><tr><th>' + tr("Nageur·euse", "Swimmer") + '</th><th>' + tr("Épreuve", "Event") +
      '</th><th>' + tr("Temps", "Time") + '</th><th>' + tr("Place", "Place") + '</th></tr></thead><tbody>';
    c.resultats.forEach(function(r) {
      var n = parseInt(r.place, 10);
      var m = MEDALS[n];
      var place = isNaN(n) ? esc(r.place || "") :
        (m ? '<span class="nat-medal ' + m[0] + '" title="' + m[1] + '" role="img" aria-label="' + m[1] + '"><i class="bi bi-award-fill"></i></span>' : '') +
        '<span class="nat-place">' + n + '<sup>' + (GAGE_EN ? enOrdinalSuffix(n) : (n === 1 ? "re" : "e")) + '</sup></span>';
      html += '<tr' + (m ? ' class="nat-podium"' : '') + '><td>' + esc(r.nom) + '</td><td>' + esc(trEvent(r.epreuve, STROKES)) +
        (r.categorie ? '<span class="nat-cat">' + esc(trEvent(r.categorie, CATS)) + '</span>' : '') +
        '</td><td><span class="nat-time">' + esc(r.temps) + '</span></td><td>' + place + '</td></tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<p class="nat-empty"><i class="bi bi-clock me-1"></i>' +
      (past ? tr("Les résultats seront publiés bientôt.", "Results will be posted soon.")
            : tr("Les résultats seront publiés après la compétition.", "Results will be posted after the meet.")) + '</p>';
  }
  var card = document.createElement("article");
  card.className = "nat-card";
  card.innerHTML = html;
  meetsBox.appendChild(card);
});

// ── Roster ────────────────────────────────────────────────────────────────
// Ajoutez vos joueurs ici.
// Exemple: { name: "Prénom", img: "photo.webp", position: "", captain: false }
// captain: true pour le/la capitaine
const PLAYERS = [
];

const IMG_BASE = "/assets/img/sportsplayers/2026-2027/NAT/";
const roster = document.getElementById("roster-container");

if (PLAYERS.length === 0) {
  roster.innerHTML = '<p class="data-loading"><i class="bi bi-people me-1"></i>' + tr("L'équipe sera annoncée prochainement.", "The team will be announced soon.") + '</p>';
} else {
  PLAYERS.forEach(function(p, i) {
    var card = document.createElement("div");
    card.className = "player-card" + (p.captain ? " captain" : "");
    card.style.animationDelay = (i * 60) + "ms";
    card.innerHTML =
      '<img class="card-photo" src="' + IMG_BASE + p.img + '" alt="' + p.name + '" loading="lazy"/>' +
      '<div class="card-overlay"></div>' +
      '<div class="card-school">GAGE</div>' +
      (p.captain ? '<div class="captain-badge" title="' + tr("Capitaine", "Captain") + '">C</div>' : '') +
      '<div class="card-info">' +
        (p.position ? '<div class="card-position">' + p.position + '</div>' : '') +
        '<div class="card-name">' + p.name + '</div>' +
      '</div>';
    roster.appendChild(card);
  });
}

</script>
