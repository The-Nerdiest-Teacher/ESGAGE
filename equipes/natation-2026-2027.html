<script>
// ── Roster ────────────────────────────────────────────────────────────────
// Ajoutez vos joueurs ici.
// Exemple: { name: "Prénom Nom", img: "photo.webp", position: "Passeur", captain: false }
// captain: true pour le/la capitaine
const PLAYERS = [
];

const IMG_BASE = "/assets/img/sportsplayers/2026-2027/NAT/";
const roster = document.getElementById("roster-container");

if (PLAYERS.length === 0) {
  roster.innerHTML = '<p class="data-loading"><i class="bi bi-people me-1"></i>' + tr("L'équipe sera annoncée prochainement.", "The team will be announced soon.") + '</p>';
} else {
  PLAYERS.forEach(function(p, i) {
    var card = document.createElement("div");
    card.className = "player-card" + (p.captain ? " captain" : "");
    card.style.animationDelay = (i * 60) + "ms";
    card.innerHTML =
      '<img class="card-photo" src="' + IMG_BASE + p.img + '" alt="' + p.name + '" loading="lazy"/>' +
      '<div class="card-overlay"></div>' +
      '<div class="card-school">GAGE</div>' +
      (p.captain ? '<div class="captain-badge" title="' + tr("Capitaine", "Captain") + '">C</div>' : '') +
      '<div class="card-info">' +
        '<div class="card-position">' + p.position + '</div>' +
        '<div class="card-name">' + p.name + '</div>' +
      '</div>';
    roster.appendChild(card);
  });
}

</script>
