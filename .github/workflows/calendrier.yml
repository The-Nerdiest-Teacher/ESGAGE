# Copies the shared Outlook calendar, plus home games from the team pages,
# to assets/data/events.json every 30 minutes.
# To update right away: Actions tab > "Calendrier (Outlook)" > Run workflow.
name: Calendrier (Outlook)

on:
  schedule:
    # Odd minutes: GitHub often skips schedules set on the hour or half hour
    - cron: "7,37 * * * *"
  workflow_dispatch:
  # Also runs right away when the link or the script changes
  push:
    paths:
      - .github/workflows/calendrier.yml
      - .github/scripts/calendrier.py
      # and when team data or a team page's MATCHS list changes
      - assets/data/sports/*.json
      - equipes/*.html

permissions:
  contents: write
  pages: write

concurrency:
  group: calendrier
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Outlook > Settings > Calendar > Shared calendars > Publish a calendar > ICS link
      CALENDAR_ICS_URL: "https://outlook.office365.com/owa/calendar/ff630cd0e6a34fb186769a1ce9923096@CSViamonde.ca/efd7d2eceaf449a7b7007a961fd73e0717076481162160073236/calendar.ics"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar==7.3.0 recurring-ical-events==3.8.2
      - run: python .github/scripts/calendrier.py
      - name: Commit if the calendar changed
        run: |
          FILES="assets/data/events.json assets/data/matchs-domicile.ics assets/data/matchs-heures.json"
          git add -N $FILES
          if git diff --quiet -- $FILES; then exit 0; fi
          git config user.name "calendrier-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Calendrier : mise à jour depuis Outlook"
          git pull --rebase
          git push
          # Pushes made by this job don't always start a site rebuild, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed"
        env:
          GH_TOKEN: ${{ github.token }}
